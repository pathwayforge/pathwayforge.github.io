# The collections, one per page; the switcher on the site's title lists them by name, alphabetically (a new one may go
# anywhere here); the first is the one the site's address opens when none was opened before. accent: the collection's
# own colour (the viewer's accent: the chosen map in the list), a set like markers in their box: one lightness and
# strength, the hue stepping round the wheel from green through teal, blue, violet and plum to red (no browns), given in the switcher's order so its dots flow down the list. A new collection takes the hue between its neighbours.
