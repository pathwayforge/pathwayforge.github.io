# The collections, one per page; the switcher on the site's title lists them by name, alphabetically (a new one may go
# anywhere here); the first is the one the site's address opens when none was opened before. accent: the collection's
# own colour (the viewer's accent: the chosen map in the list), a soft set: one lightness and
# strength (OKLCH L .55, C .08, white text at least 4.6:1), the hue stepping from rose through plum,
# violet, blue and teal to green (no browns), given in the switcher's order so its dots flow down the list. A new collection takes the hue between its neighbours.
- id: air
  name: Atlas of Inflammation Resolution
  path: /air/
  accent: "#73699c"
