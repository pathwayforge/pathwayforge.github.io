---
layout: null
collection: kegg-hover
---
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Global map, hover</title>
<link rel="icon" type="image/svg+xml" href="/images/favicon-kegg/favicon.svg?v=pl237">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-kegg/favicon-32.png?v=pl237">
<link rel="apple-touch-icon" href="/images/favicon-kegg/apple-touch-icon.png?v=pl237">
<style>
  :root { --ink: #202124; --mute: #5f6368; --line: #dadce0; --accent: #1a73e8; --bg: #fff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* .tabs and .zoom set display: flex, which would otherwise keep them on screen when signed out */
  button:focus { outline: none; }
  button:focus-visible { outline: 1px solid #bdc1c6; outline-offset: 1px; }   /* quiet, keyboard only */
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid #eceff1; flex-wrap: wrap; }
  /* quiet, as the viewer: Helvetica Neue 300, no bold, no frames; the chosen tab in ink, the others grey */
  header h1 { font: 300 20px/1.35 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 1px; color: #333; margin: 0 8px 0 0; }   /* as the other collections' name, same place (user) */
  .tabs { display: flex; gap: 14px; }
  .tabs button, .zoom button { border: 0; background: none; color: #80868b; padding: 4px 2px; font: 300 14px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .5px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { color: var(--ink); }
  .zoom button { width: 28px; height: 28px; border-radius: 4px; font-size: 16px; padding: 0; }
  .zoom button:hover { background: #f1f3f4; }
  #zfit { width: auto; padding: 0 6px; font-size: 13px; }
  form button { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  form button:hover { background: #f1f3f4; }
  .zoom { display: flex; gap: 2px; margin-left: auto; align-items: center; }
  #note { color: var(--mute); font-size: 12px; }
  #out:hover { color: var(--ink); background: none; }
  #out { color: #9aa0a6; background: none; border: 0; padding: 0 0 0 10px; white-space: nowrap; cursor: pointer; width: auto; font: 300 12px "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { flex: none; }
  main { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
  #view { position: absolute; inset: 0; cursor: grab; }
  #view.drag { cursor: grabbing; }
  #view svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #tip { position: fixed; pointer-events: none; max-width: min(420px, calc(100vw - 16px)); white-space: pre-line; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.15); display: none; z-index: 5; }
  @media (max-width: 560px) { .zoom { margin-left: 0; } }
  #signin { max-width: 360px; margin: 64px auto; padding: 0 16px; }
  #signin input { display: block; width: 100%; margin: 4px 0 12px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  #signin input:focus { outline: none; border-color: #999; }   /* as the viewer's search field */
  #signin p { color: var(--mute); }
  #msg { color: #c5221f; min-height: 1.4em; }
</style>
</head>
<body>
<header>
  <h1 data-forge-title>{% assign col = site.data.collections | where: "id", page.collection | first %}{{ col.name }}</h1>
  <div class="tabs" id="tabs" hidden>
    <button type="button" data-map="kegg-2026" aria-pressed="false" title="KEGG map 01100 as it is now">Current</button>
    <button type="button" data-map="kegg-2017" aria-pressed="false" title="KEGG map 01100 of 2017, with the class boxes">2017, with classes</button>
  </div>
  <span id="note"></span>
  <div class="zoom" id="zoom" hidden>
    <button type="button" id="zin" aria-label="Zoom in">+</button>
    <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
    <button type="button" id="zfit" title="Whole map">Fit</button>
    <button type="button" id="out" title="Forget the token in this browser">Sign out</button>
  </div>
</header>
<main id="main">
  <form id="signin" hidden autocomplete="on">
    <p>This page reads its maps from a private repository. Sign in with the site's token.</p>
    <label for="u">Repository</label>
    <input id="u" name="username" autocomplete="username" placeholder="owner/repository" required>
    <label for="p">Token</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div id="msg"></div>
    <button type="submit">Sign in</button>
  </form>
  <div id="view" hidden></div>
</main>
<div id="tip"></div>
<script>
(function () {
  // the first page of /kegg/ (2026-11-14), kept at /kegg/hover/: its own drawing, hover names, a click to the KEGG entry.
  // One sign-in with /kegg/ and the editor: the token is kept under the viewer's key, the repository is the site's own.
  var KEY = 'atlas-edit-token', DIR = 'closed/kegg-hover', CACHE = 'closed-kegg-hover';
  var OWNER = location.hostname.split('.')[0], REPO = OWNER + '/' + OWNER;
  var $ = function (id) { return document.getElementById(id); };
  var cred = null;
  try { var t0 = localStorage.getItem(KEY); if (t0) cred = { repo: REPO, token: t0 }; } catch (e) {}

  // the data repository: <owner>/<owner>-data, from the repository typed (the password manager fills <org>/<org>)
  function dataRepo(r) { var o = r.trim().split('/')[0]; return o + '/' + o + '-data'; }
  function api(path, raw) {
    return fetch('https://api.github.com/repos/' + dataRepo(cred.repo) + path, {
      headers: { Authorization: 'Bearer ' + cred.token, Accept: raw ? 'application/vnd.github.raw' : 'application/vnd.github+json' },
      cache: 'no-cache'
    }).then(function (r) {
      if (!r.ok) { var e = new Error(r.status); e.status = r.status; e.limit = r.headers.get('x-ratelimit-remaining') === '0'; throw e; }
      return raw ? r.text() : r.json();
    });
  }
  function why(e) {
    return e.status === 401 ? 'The token was not accepted.' :
      e.status === 404 ? 'The token cannot read ' + dataRepo(cred.repo) + ', or the maps are not there.' :
      (e.status === 403 && e.limit) || e.status === 429 ? 'GitHub\'s rate limit is reached; try again in a few minutes.' :
      e.status === 403 ? 'The token has no access to ' + dataRepo(cred.repo) + '.' :
      e.status >= 500 ? 'GitHub is not answering (' + e.status + '); try again later.' :
      e.status ? 'GitHub refused (' + e.status + ').' : 'Could not reach GitHub (' + e.message + ').';
  }

  // files by git blob sha, kept in the browser's cache so a file is downloaded once until it changes
  var cacheP = null, mem = {}, files = {}, loaded = {}, current = null, want = null;
  function cache() {
    if (!cacheP) cacheP = ('caches' in window) ? caches.open(CACHE).catch(function () { return null; }) : Promise.resolve(null);
    return cacheP;
  }
  function blob(sha) {
    if (mem[sha]) return mem[sha];
    var url = 'https://cache.local/' + sha;
    mem[sha] = cache().then(function (c) {
      return (c ? c.match(url) : Promise.resolve(null)).then(function (hit) {
        if (hit) return hit.text();
        return api('/git/blobs/' + sha, true).then(function (t) {
          if (c) c.put(url, new Response(t)).catch(function () {});
          return t;
        });
      });
    });
    mem[sha].catch(function () { delete mem[sha]; });
    return mem[sha];
  }
  function load(name) {
    if (!files[name + '.svg'] || !files[name + '.json']) return Promise.reject(new Error('not in ' + DIR));
    if (!loaded[name]) {
      loaded[name] = Promise.all([blob(files[name + '.svg']), blob(files[name + '.json'])]).then(function (r) {
        var box = document.createElement('div');
        box.innerHTML = r[0];
        var svg = box.querySelector('svg');
        box.removeChild(svg);
        return { name: name, svg: svg, info: JSON.parse(r[1]), W: svg.viewBox.baseVal.width, H: svg.viewBox.baseVal.height };
      });
      loaded[name].catch(function () { delete loaded[name]; });   // a failed load is tried again next time
    }
    return loaded[name];
  }
  function reset() {
    if (current) current.svg.remove();
    files = {}; loaded = {}; mem = {}; current = null; want = null;
  }

  function showSignin(text) {
    $('signin').hidden = false; $('view').hidden = true; $('tabs').hidden = true; $('zoom').hidden = true;
    tip.style.display = 'none';
    $('msg').textContent = text || '';
    $('u').value = REPO;
  }
  $('signin').addEventListener('submit', function (ev) {
    ev.preventDefault();
    cred = { repo: $('u').value.trim(), token: $('p').value.trim() };
    start(true);
  });
  // signing out forgets the token and the maps kept in this browser
  $('out').addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    if ('caches' in window) caches.delete(CACHE).catch(function () {});
    cacheP = null; reset();
    cred = null; $('p').value = ''; showSignin('');
  });

  function start(typed) {
    reset();
    $('msg').textContent = 'Reading ' + dataRepo(cred.repo) + ' ...';
    api('/contents/' + DIR).then(function (list) {
      if (!Array.isArray(list)) throw new Error(DIR + ' is not a folder');
      list.forEach(function (f) { files[f.name] = f.sha; });
      if (typed) { try { localStorage.setItem(KEY, cred.token); } catch (e) {} }
      $('signin').hidden = true; $('view').hidden = false; $('tabs').hidden = false; $('zoom').hidden = false;
      var first = 'kegg-2026';
      try { if (localStorage.getItem('closed-kegg-hover-map') === 'kegg-2017') first = 'kegg-2017'; } catch (e) {}
      show(first).then(function () {   // then the other map, quietly
        Object.keys(files).forEach(function (f) { if (/\.svg$/.test(f)) load(f.replace(/\.svg$/, '')).catch(function () {}); });
      });
    }).catch(function (e) { showSignin(why(e)); });
  }

  // the view is the SVG's own viewBox, so the browser draws the lines afresh at every zoom (sharp, never a scaled
  // picture); changes are drawn once per frame
  var view = $('view'), s = 1, tx = 0, ty = 0, W = 1, H = 1, frame = 0;
  function apply() {
    if (!current || frame) return;
    frame = requestAnimationFrame(function () {
      frame = 0;
      var r = view.getBoundingClientRect();
      current.svg.setAttribute('viewBox', [-tx / s, -ty / s, r.width / s, r.height / s].join(' '));
    });
  }
  function fit() {
    var r = view.getBoundingClientRect();
    s = Math.min(r.width / W, r.height / H); tx = (r.width - W * s) / 2; ty = (r.height - H * s) / 2; apply();
  }
  function zoomAt(f, cx, cy) {
    var ns = Math.max(0.05, Math.min(8, s * f)); f = ns / s;
    tx = cx - (cx - tx) * f; ty = cy - (cy - ty) * f; s = ns; apply();
  }
  function press(name) {
    [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.setAttribute('aria-pressed', b.dataset.map === name); });
  }
  // a map switch shows the whole new map (the two versions differ in size and layout); only the last one asked for shows
  function show(name) {
    want = name; press(name);
    try { localStorage.setItem('closed-kegg-hover-map', name); } catch (e) {}
    return load(name).then(function (m) {
      if (want !== name) return;
      if (current && current.svg !== m.svg) current.svg.remove();
      current = m;
      if (m.svg.parentNode !== view) view.appendChild(m.svg);
      W = m.W; H = m.H;
      fit();
      $('note').textContent = '';
    }).catch(function (e) {
      if (want !== name) return;
      if (current) { want = current.name; press(current.name); }   // the map shown stays, its tab pressed again
      $('note').textContent = 'Could not load this map: ' + why(e);
    });
  }
  [].forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    b.addEventListener('click', function () { show(b.dataset.map); });
  });
  $('zin').addEventListener('click', function () { var r = view.getBoundingClientRect(); zoomAt(1.4, r.width / 2, r.height / 2); });
  $('zout').addEventListener('click', function () { var r = view.getBoundingClientRect(); zoomAt(1 / 1.4, r.width / 2, r.height / 2); });
  $('zfit').addEventListener('click', fit);
  view.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var r = view.getBoundingClientRect();
    zoomAt(Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0025)), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });

  // drag pans, two fingers pinch; a press that did not move is a click. With a mouse a click opens the KEGG entry; on a
  // touch screen the first tap shows what the element is, a second tap on the same element opens it
  var pts = {}, moved = 0, startEl = null, tapped = null;
  view.addEventListener('pointerdown', function (ev) {
    if (!Object.keys(pts).length) { moved = 0; startEl = ev.target; }
    else moved += 10;   // a second finger: a pinch, never a click
    pts[ev.pointerId] = { x: ev.clientX, y: ev.clientY }; view.setPointerCapture(ev.pointerId);
    view.classList.add('drag'); view.style.cursor = '';
  });
  view.addEventListener('pointermove', function (ev) {
    if (!pts[ev.pointerId]) { if (ev.pointerType === 'mouse') hover(ev, ev.target); return; }
    var ids = Object.keys(pts), p = pts[ev.pointerId];
    if (ids.length === 1) {
      tx += ev.clientX - p.x; ty += ev.clientY - p.y; moved += Math.abs(ev.clientX - p.x) + Math.abs(ev.clientY - p.y); apply();
    } else if (ids.length === 2) {
      var o = pts[ids[0] == ev.pointerId ? ids[1] : ids[0]];
      var d0 = Math.hypot(p.x - o.x, p.y - o.y), d1 = Math.hypot(ev.clientX - o.x, ev.clientY - o.y);
      var r = view.getBoundingClientRect();
      if (d0 > 0) zoomAt(d1 / d0, (ev.clientX + o.x) / 2 - r.left, (ev.clientY + o.y) / 2 - r.top);
    }
    if (moved >= 5) { tip.style.display = 'none'; tapped = null; }
    pts[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
  });
  function up(ev) { delete pts[ev.pointerId]; if (!Object.keys(pts).length) view.classList.remove('drag'); }
  view.addEventListener('pointerup', function (ev) {
    var last = Object.keys(pts).length === 1;
    up(ev);
    if (!last || moved >= 5) return;
    var el = startEl, t = item(el);   // the element pressed (with pointer capture, the event's own target is the view)
    if (ev.pointerType === 'mouse') { if (t && t.url) window.open(t.url, '_blank', 'noopener'); return; }
    if (t && t.url && tapped === elId(el)) { window.open(t.url, '_blank', 'noopener'); tapped = null; tip.style.display = 'none'; return; }
    tapped = t ? elId(el) : null;
    hover(ev, el);
  });
  view.addEventListener('pointercancel', up);
  window.addEventListener('resize', apply);

  // what KEGG (or iPath) shows for the element
  var tip = $('tip');
  function elId(el) {
    while (el && current && el !== current.svg && !el.id) el = el.parentNode;
    return el && el.id;
  }
  function item(el) {
    var id = current && elId(el), d = id && current.info[id];
    return d ? { text: d[0], url: d[1] } : null;
  }
  function hover(ev, el) {
    var t = item(el);
    view.style.cursor = t && t.url ? 'pointer' : '';
    if (!t || !t.text) { tip.style.display = 'none'; return; }
    tip.textContent = t.text.split(' | ').join('\n');
    tip.style.display = 'block';
    var x = ev.clientX + 14, y = ev.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
    if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  }
  view.addEventListener('pointerleave', function (ev) { if (ev.pointerType === 'mouse') tip.style.display = 'none'; });

  if (cred && cred.token) start(false); else showSignin('');
})();
</script>
{% include forge-switch.html %}
</body>
</html>
