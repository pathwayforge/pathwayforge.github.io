<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>
    {% include meta.html %}
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css?v={{ site.time | date: '%s' }}" />
    {% assign col = site.data.collections | where: "id", page.collection | first %}
    {% if col %}<style>:root { --m2-accent: {{ col.accent }}; --forge-accent: {{ col.accent }}; }</style>{% endif %}
  </head>
  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <div class="site-info">
            <h1 class="site-name" data-forge-title>{% if col %}{{ col.name }}{% else %}{{ site.name }}{% endif %}</h1>
          </div>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    {% include forge-switch.html %}
    {% include analytics.html %}
  </body>
</html>
