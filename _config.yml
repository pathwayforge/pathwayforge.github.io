name: Pathway Forge
description: "Published pathway resources, for review"
google_analytics:
url: https://pathwayforge.github.io
baseurl: ""
# the tab icon's board code, added to its links so browsers fetch a new icon at once
icon: favicon-kegg
icon_version: pl237
defaults:
  # kept out of search engines (noindex in _includes/meta.html; robots.txt too)
  - scope:
      path: ""
    values:
      noindex: true
permalink: /:title/
kramdown:
  input: GFM
sass:
  style: :expanded
exclude:
  - README.md
  - CLAUDE.md
